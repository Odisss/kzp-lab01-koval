name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify "-Dbuild.number=${{ github.run_number }}"

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify "-Dbuild.number=${{ github.run_number }}"

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/*.jar
          if-no-files-found: error

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Build wheel
        run: python -m build

      - name: Install wheel into clean venv and run CLI
        shell: bash
        run: |
          python -m venv .venv-wheel
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv-wheel/Scripts/python; else PY=.venv-wheel/bin/python; fi
          "$PY" -m pip install --no-deps dist/*.whl
          "$PY" -m kzp_lab06.cli data/lab06.csv reports/wheel-summary.txt
          diff --strip-trailing-cr data/lab06-expected-report.txt reports/wheel-summary.txt
          set +e
          "$PY" -m kzp_lab06.cli data/lab06-invalid.csv reports/invalid.txt
          code=$?
          set -e
          echo "exit code for invalid CSV: $code"
          test "$code" -eq 2
          "$PY" -m kzp_lab07.cli data/lab06.csv reports/lab07-summary.txt
          diff --strip-trailing-cr data/lab06-expected-report.txt reports/lab07-summary.txt
          "$PY" -m kzp_lab07.cli data/lab07.csv reports/lab07-scores.txt --scores
          diff --strip-trailing-cr data/lab07-expected-report.txt reports/lab07-scores.txt
          set +e
          "$PY" -m kzp_lab07.cli data/lab07-invalid.csv reports/lab07-invalid.txt
          code=$?
          set -e
          echo "lab07 exit code for invalid CSV: $code"
          test "$code" -eq 2

      - name: Upload wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ github.run_number }}
          path: dist/*.whl
          if-no-files-found: error
